<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="ASTRAL — a clean, fast browsing workspace.">
  <title>ASTRAL</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="ASTRAL home"><span class="brand-mark">A</span> ASTRAL</a>
      <span class="status"><i></i> SYSTEM ONLINE</span>
    </header>

    <section class="hero">
      <p class="eyebrow">YOUR SPACE, YOUR WEB</p>
      <h1>Explore beyond<br><span>the ordinary.</span></h1>
      <p class="subhead">A quieter, faster place to start browsing.</p>

      <form class="search" id="address-form">
        <span class="search-icon" aria-hidden="true">↗</span>
        <input id="address" type="text" placeholder="Search or enter a website" autocomplete="off" spellcheck="false" aria-label="Search or enter a website">
        <button type="submit">GO <span>→</span></button>
      </form>
      <p class="hint" id="hint">The browsing engine is being connected. This starter does not proxy requests yet.</p>

      <div class="quick-links" aria-label="Quick links">
        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><span class="link-icon">▶</span><span>YouTube</span></a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><span class="link-icon">◎</span><span>Instagram</span></a>
        <a href="https://www.wikipedia.org/" target="_blank" rel="noopener noreferrer"><span class="link-icon">W</span><span>Wikipedia</span></a>
      </div>
    </section>

    <footer><span>ASTRAL <b>0.1.0</b></span><span>BUILT FOR THE OPEN WEB</span></footer>
  </main>
</body>
</html>
